name: Build and deploy Python app to Azure Web App - sohail-shaik-portfolio-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: backend/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download app
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          auth-type: IDENTITY
          subscription-id: 16a217bf-f426-4e0a-8bca-dbe73f417e12

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: sohail-shaik-portfolio-api
